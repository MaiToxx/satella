# Vérifications à chaque push et pull request : syntaxe et tests unitaires.
# Les tests n'ont besoin ni de matériel ni des modules natifs (repli
# automatique quand node-hid, koffi ou uiohook sont absents).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntaxe
        run: |
          for f in main.js preload.js $(find src ui test -name '*.js'); do
            node --check "$f"
          done
      - name: Tests unitaires
        run: node --test "test/*.test.js"

  # Sur une pull request et sur main : l'application lancée pour de vrai
  # (Electron sous écran virtuel) et pilotée comme par un utilisateur
  e2e:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test de bout en bout
        run: xvfb-run -a npm run test:e2e

  # Sur une pull request : tests sous Windows avec les vrais modules natifs,
  # puis construction de l'installeur (sans publication), téléchargeable
  # pendant 7 jours depuis la page du run pour l'essayer avant de publier.
  windows:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests unitaires (Windows)
        run: node --test "test/*.test.js"
      - name: Chargement des modules natifs
        run: node -e "require('node-hid'); require('koffi'); require('./src/macros/input').available || process.exit(1); console.log('modules natifs ok')"
      - name: Construire l'installeur (sans publier)
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Satella-Setup
          path: dist/*.exe
          retention-days: 7
